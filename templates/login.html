{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Login</h2>
  <form method="POST">
    <label>Email</label>
    <input name="email" type="email" required />
    <label>Password</label>
    <input name="password" type="password" required />
    <button type="submit" class="btn">Sign in</button>
  </form>
</div>
{% endblock %}
