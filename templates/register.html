{% extends 'base.html' %}
{% block content %}
<section class="auth-shell">
  <div class="card auth-card">
    <h2>{{ 'Worker Registration' if mode == 'technician' else 'User Registration' }}</h2>
    <form method="POST" class="form-grid">
      <label>Full Name</label>
      <input name="name" required />

      <label>Email</label>
      <input name="email" type="email" required />

      <label>Phone</label>
      <input name="phone" required />

      {% if mode == 'technician' %}
      <label>Service Specializations</label>
      <div class="checkbox-grid">
        {% for service in services %}
          <label class="pill"><input type="checkbox" name="services" value="{{ service }}" /> {{ service }}</label>
        {% endfor %}
      </div>

      <label>Cities covered (comma separated)</label>
      <input name="cities" placeholder="e.g., mumbai,pune" required />

      <label>Base GPS coordinates</label>
      <input name="base_gps" placeholder="19.0760,72.8777" />

      <label>Profile Photo URL</label>
      <input name="profile_photo" placeholder="https://..." />
      {% endif %}

      <label>Password</label>
      <input name="password" type="password" required />

      <button type="submit" class="btn">Create Account</button>
    </form>
  </div>
</section>
{% endblock %}
